<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#08121e"><title>Draw Your Sound</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#08121e;color:#eaf2fc}button,input,select{font:inherit}button{border:1px solid #40546c;background:#182b40;color:#eaf2fc;border-radius:11px;padding:10px 12px;touch-action:manipulation}button:active{background:#294660}.primary{background:#138cb8;border-color:#138cb8;font-weight:700}.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow:hidden}.top{display:flex;align-items:center;gap:7px;padding:8px 10px;background:#122235;flex:none}.top strong{flex:1;font-size:13px;letter-spacing:.04em}.top button{font-size:13px;padding:9px}.stage{flex:1;min-height:100px;position:relative;touch-action:none;overscroll-behavior:contain}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}.bottom{flex:none;background:#122235;padding:8px 12px 10px;display:grid;gap:7px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.sub{font-size:11px;color:#a7bfd3}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:11px;color:#b9cad9}select,input[type=number]{display:block;width:100%;background:#1b3148;color:#fff;border:1px solid #3b526c;border-radius:8px;padding:7px;margin-top:3px}input[type=range]{width:100%;accent-color:#4be2ad}.drawer{position:absolute;bottom:0;left:0;right:0;z-index:3;background:#14273b;border-top:1px solid #40556d;border-radius:14px 14px 0 0;padding:13px;max-height:70%;overflow:auto;box-shadow:0 -10px 30px #0008}.drawer[hidden]{display:none}.sliderline{display:grid;grid-template-columns:90px 1fr 40px;gap:7px;align-items:center;font-size:12px}.sliderline input{min-width:0}.notice{font-size:11px;color:#9fb4c7}.equation{font-family:ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.6}.pill{padding:5px 9px;font-size:11px}.actions{display:flex;gap:6px}.actions button{flex:1}.hide{display:none!important}</style></head><body>
<div class="app"><header class="top"><strong>DRAW YOUR SOUND</strong><button id="play" class="primary">▶ Play</button><button id="undo" aria-label="Скасувати">↶</button><button id="settings">⚙</button></header><main class="stage"><canvas id="canvas"></canvas><div id="drawer" class="drawer" hidden><div class="bar"><b>Звук і проєкт</b><button id="close">✕</button></div><div class="controls"><label>Тембр<select id="wave"><option value="sawtooth">Analog saw</option><option value="sine">Sine</option><option value="triangle">Triangle</option><option value="square">Square</option></select></label><label>Цикл<select id="duration"><option value="4">4 с</option><option value="8" selected>8 с</option><option value="16">16 с</option></select></label></div><div id="sliders"></div><div class="actions"><button id="demo">Приклад</button><button id="clear">Очистити</button><button id="export">Експорт</button><button id="import">Імпорт</button></div><input id="file" type="file" accept="application/json,.json" hidden><p class="notice">Проєкт автоматично зберігається на цьому пристрої. Експорт створює резервну JSON-копію.</p><div class="equation" id="formula"></div></div></main><footer class="bottom"><div class="bar"><span class="sub" id="info">20 Гц — 16 кГц · 8 с</span><button class="pill" id="example">Приклад</button><button class="pill" id="erase">Очистити</button></div><div class="bar"><label for="volume">Гучність</label><input id="volume" type="range" min="0" max="35" value="15" style="flex:1"><span class="sub" id="vol-label">15%</span></div><span class="sub" id="status">Малюй зліва направо. Вертикаль — частота, горизонталь — час.</span></footer></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('canvas'),g=c.getContext('2d');let lines=[],draft=null,pointer=null,ctx=null,master=null,comp=null,delay=null,wet=null,feedback=null,playing=false,started=0,scheduledCycle=0,interval=null,raf=0,voices=[];const colors=['#4be2ad','#73b9fa','#eab46a','#d49af2','#f58ba7','#e4d379'];const params={bass:65,drive:45,delay:25};const dur=()=>Number($('duration').value);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const hz=y=>20*Math.pow(800,1-clamp(y,0,1));const fy=f=>1-Math.log(clamp(f,20,16000)/20)/Math.log(800);const db=()=>Math.max(0,Number($('volume').value)/100);const save=()=>{try{localStorage.setItem('drawsound-v1',JSON.stringify({lines,params,wave:$('wave').value,duration:dur(),volume:$('volume').value}));}catch(e){}};
function load(){try{let o=JSON.parse(localStorage.getItem('drawsound-v1'));if(o&&Array.isArray(o.lines)){lines=o.lines.filter(l=>Array.isArray(l)&&l.length>=2).slice(0,80).map(l=>l.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).map(p=>({x:clamp(p.x,0,1),y:clamp(p.y,0,1)}))).filter(l=>l.length>=2);Object.assign(params,o.params||{});if(['sine','triangle','square','sawtooth'].includes(o.wave))$('wave').value=o.wave;if([4,8,16].includes(o.duration))$('duration').value=o.duration;if(Number.isFinite(+o.volume))$('volume').value=clamp(+o.volume,0,35);}}catch(e){}}
function resize(){const rect=c.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(rect.width*scale));c.height=Math.max(1,Math.round(rect.height*scale));draw();}
function pos(e){const r=c.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}}
function draw(){let w=c.width,h=c.height,d=w/Math.max(c.clientWidth,1),L=43*d,R=w-8*d,T=12*d,B=h-22*d;g.fillStyle='#08121e';g.fillRect(0,0,w,h);g.font=11*d+'px system-ui';[16000,8000,4000,2000,1000,500,250,125,60,20].forEach(f=>{let y=T+fy(f)*(B-T);g.strokeStyle='#253b4c';g.lineWidth=d*.6;g.beginPath();g.moveTo(L,y);g.lineTo(R,y);g.stroke();g.textAlign='right';g.fillStyle='#94adbf';g.fillText(f>=1000?f/1000+'k':f,L-6*d,y+4*d)});for(let i=0;i<=8;i++){let x=L+(R-L)*i/8;g.strokeStyle='#203247';g.beginPath();g.moveTo(x,T);g.lineTo(x,B);g.stroke();g.textAlign='center';g.fillStyle='#94adbf';g.fillText((dur()*i/8).toFixed(0),x,h-5*d)}const path=(line,i)=>{if(!line.length)return;g.strokeStyle=colors[i%colors.length];g.lineWidth=3*d;g.lineJoin='round';g.lineCap='round';g.beginPath();line.forEach((p,j)=>{let x=L+p.x*(R-L),y=T+p.y*(B-T);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()};lines.forEach(path);if(draft)path(draft,lines.length);if(playing&&ctx){let t=((ctx.currentTime-started)%dur()+dur())%dur(),x=L+t/dur()*(R-L);g.strokeStyle='#fff1a0';g.lineWidth=2*d;g.beginPath();g.moveTo(x,T);g.lineTo(x,B);g.stroke()}$('info').textContent=lines.length+' доріжок · 20 Гц — 16 кГц · '+dur()+' с';}
function equation(){let s='fᵢ(t) = 20 × 800^(1 − yᵢ(t))\nφᵢ(t) = 2π ∫₀ᵗ fᵢ(τ)dτ\ns(t) = Σᵢ Aᵢ(t) · osc(φᵢ(t))\n';lines.slice(0,8).forEach((l,i)=>{let a=l[0],b=l[l.length-1];s+='L'+(i+1)+': '+hz(a.y).toFixed(1)+' → '+hz(b.y).toFixed(1)+' Гц; '+(a.x*dur()).toFixed(2)+'–'+(b.x*dur()).toFixed(2)+' с\n'});$('formula').textContent=s;}
function changed(){save();equation();draw();}
c.addEventListener('pointerdown',e=>{if(pointer!==null||!e.isPrimary)return;e.preventDefault();pointer=e.pointerId;c.setPointerCapture(pointer);draft=[pos(e)];draw()});c.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||!draft)return;e.preventDefault();let p=pos(e),last=draft[draft.length-1];p.x=Math.max(last.x,p.x);if(p.x-last.x>.001||Math.abs(p.y-last.y)>.004){draft.push(p);draw()}});c.addEventListener('pointerup',e=>{if(pointer!==e.pointerId)return;pointer=null;if(draft&&draft.length>1){lines.push(draft);changed()}draft=null;draw()});c.addEventListener('pointercancel',()=>{pointer=null;draft=null;draw()});
function audio(){if(ctx)return true;const A=window.AudioContext||window.webkitAudioContext;if(!A){$('status').textContent='Цей браузер не підтримує Web Audio';return false}ctx=new A();master=ctx.createGain();master.gain.value=db();comp=ctx.createDynamicsCompressor();comp.threshold.value=-19;comp.ratio.value=10;comp.attack.value=.003;comp.release.value=.15;master.connect(comp);comp.connect(ctx.destination);delay=ctx.createDelay(1);delay.delayTime.value=.27;feedback=ctx.createGain();feedback.gain.value=.24;wet=ctx.createGain();wet.gain.value=params.delay/200;master.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(wet);wet.connect(comp);return true}
function voice(line,base){if(line.length<2)return;let begin=base+line[0].x*dur(),end=base+line[line.length-1].x*dur();if(end<=ctx.currentTime+.01)return;let now=Math.max(ctx.currentTime+.006,begin);let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=$('wave').value;let f0=hz(line[0].y),bass=f0<180;let amp=(bass?.22:.12)*(1+params.drive/250)/Math.sqrt(Math.max(1,lines.length));gain.gain.setValueAtTime(.0001,now);let attack=Math.min(.02,Math.max(.003,(end-now)/4));gain.gain.linearRampToValueAtTime(amp,now+attack);gain.gain.setValueAtTime(amp,Math.max(now+attack+.001,end-.045));gain.gain.exponentialRampToValueAtTime(.0001,end+.03);let prev=line[0];for(let i=1;i<line.length;i++){let p=line[i];if(base+p.x*dur()>now){let before=base+prev.x*dur();if(before<=now){let alpha=clamp((now-before)/Math.max(.00001,(p.x-prev.x)*dur()),0,1);let y=prev.y+(p.y-prev.y)*alpha;osc.frequency.setValueAtTime(hz(y),now)}break}prev=p}if(line.length===1||base+line[line.length-1].x*dur()<=now)osc.frequency.setValueAtTime(hz(prev.y),now);line.forEach(p=>{let t=base+p.x*dur();if(t>now+.001)osc.frequency.linearRampToValueAtTime(hz(p.y),t)});osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(end+.04);voices.push(osc);osc.onended=()=>{voices=voices.filter(v=>v!==osc);osc.disconnect();gain.disconnect()}}
function schedule(){if(!playing)return;let cycle=Math.floor((ctx.currentTime-started+.1)/dur());while(scheduledCycle<=cycle){let base=started+scheduledCycle*dur();lines.forEach(l=>voice(l,base));scheduledCycle++}}
function animate(){if(!playing)return;draw();raf=requestAnimationFrame(animate)}
function stop(){playing=false;clearInterval(interval);cancelAnimationFrame(raf);voices.forEach(o=>{try{o.stop()}catch(e){}});voices=[];$('play').textContent='▶ Play';draw()}
$('play').onclick=async()=>{if(playing){stop();return}if(!audio())return;try{await ctx.resume();playing=true;started=ctx.currentTime+.06;scheduledCycle=0;interval=setInterval(schedule,25);$('play').textContent='■ Stop';animate()}catch(e){$('status').textContent='Не вдалося запустити аудіо: '+e.message}};
$('undo').onclick=()=>{lines.pop();changed()};function clear(){if(!confirm('Очистити всі намальовані доріжки?'))return;stop();lines=[];changed()}$('erase').onclick=clear;$('clear').onclick=clear;
function demo(){stop();lines=[[[0,55],[.2,55],[.24,82],[.48,82],[.52,55],[.75,55],[.96,110]],[[.08,220],[.28,330],[.52,440],[.75,660],[.96,440]],[[.1,880],[.35,1760],[.7,1320],[.95,3520]]].map(l=>l.map(([x,f])=>({x,y:fy(f)})));changed();$('drawer').hidden=true} $('example').onclick=demo;$('demo').onclick=demo;
$('settings').onclick=()=>{$('drawer').hidden=!$('drawer').hidden};$('close').onclick=()=>{$('drawer').hidden=true};$('duration').onchange=()=>{stop();changed()};$('wave').onchange=save;$('volume').oninput=()=>{$('vol-label').textContent=$('volume').value+'%';if(ctx)master.gain.setTargetAtTime(db(),ctx.currentTime,.02);save()};
const sliders=$('sliders');[['bass','Глибина басу'],['drive','Насичення'],['delay','Delay']].forEach(([k,name])=>{let row=document.createElement('div');row.className='sliderline';row.innerHTML='<span>'+name+'</span><input type="range" min="0" max="100" value="'+params[k]+'"><span>'+params[k]+'%</span>';sliders.appendChild(row);let input=row.querySelector('input');input.oninput=()=>{params[k]=+input.value;row.lastElementChild.textContent=params[k]+'%';if(k==='delay'&&ctx)wet.gain.setTargetAtTime(params[k]/200,ctx.currentTime,.02);save()}});
$('export').onclick=()=>{let data=JSON.stringify({version:1,lines,params,wave:$('wave').value,duration:dur(),volume:+$('volume').value},null,2);let url=URL.createObjectURL(new Blob([data],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='draw-your-sound.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.lines))throw Error('Некоректний формат');stop();lines=o.lines.slice(0,80).map(l=>l.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).map(p=>({x:clamp(p.x,0,1),y:clamp(p.y,0,1)}))).filter(l=>l.length>1);changed();$('drawer').hidden=true}catch(err){$('status').textContent='Помилка імпорту: '+err.message}e.target.value=''};
load();$('vol-label').textContent=$('volume').value+'%';equation();new ResizeObserver(resize).observe(c);resize();document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop()});
})();
</script></body></html>
