<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draw Sound">
<meta name="theme-color" content="#08121e">
<meta name="description" content="Draw Your Sound — малюйте звук: частотне полотно, Piano Roll і драм-секвенсор в одному інструменті.">
<title>Draw Your Sound</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btnMenu" class="icon" aria-label="Проєкти та експорт">≡</button>
    <button id="projName" class="name" aria-label="Назва проєкту">Проєкт</button>
    <span id="saveState" class="savestate" title="Помилка збереження"></span>
    <span class="spacer"></span>
    <button id="btnUndo" class="icon" aria-label="Скасувати" title="Скасувати (⌘Z)" disabled>↶</button>
    <button id="btnRedo" class="icon" aria-label="Повернути" title="Повернути (⇧⌘Z)" disabled>↷</button>
    <button id="btnBpm" class="bpm" aria-label="Темп і лад"><b id="bpmVal">120</b><small>BPM</small></button>
    <button id="btnPlay" class="play" aria-label="Грати" title="Грати / стоп (Пробіл)">▶</button>
  </header>
  <nav id="views" role="tablist" aria-label="Режими"></nav>
  <div id="trackbar" aria-label="Доріжки"></div>
  <main id="stage">
    <section data-view="draw"><canvas id="cvDraw" aria-label="Частотне полотно"></canvas></section>
    <section data-view="notes" hidden><canvas id="cvNotes" aria-label="Piano Roll"></canvas></section>
    <section data-view="drums" id="drumView" hidden></section>
    <section data-view="mix" id="mixView" hidden></section>
  </main>
  <footer id="bottom">
    <div id="toolbar" role="toolbar"></div>
    <div id="status" aria-live="polite"></div>
  </footer>
</div>

<div id="sheet" hidden>
  <div id="sheetBackdrop"></div>
  <div id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" class="icon" aria-label="Закрити">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" role="status"></div>
<input id="fileInput" type="file" accept="application/json,.json" hidden>
<noscript>Для роботи Draw Your Sound потрібен JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
